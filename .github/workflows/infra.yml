name: Infrastructure

# Terraform for the production VM, static IP, firewall and snapshot schedule (infra/terraform/main).
# Pull requests get a plan; merging to main applies it. GitHub authenticates to Google Cloud with
# Workload Identity Federation (short-lived tokens, no JSON key), as a service account that can
# manage Compute Engine and nothing else.
#
# Repository variables (not secrets; set once after bootstrap, see infra/terraform/README.md):
#   GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_TF_SERVICE_ACCOUNT, GCP_VM_SERVICE_ACCOUNT, TF_STATE_BUCKET

on:
  pull_request:
    paths:
      ['infra/terraform/main/**', 'infra/vm/**', 'infra/nginx/**', '.github/workflows/infra.yml']
  push:
    branches: [main]
    paths:
      ['infra/terraform/main/**', 'infra/vm/**', 'infra/nginx/**', '.github/workflows/infra.yml']
  workflow_dispatch:

concurrency:
  group: terraform-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # exchange GitHub's OIDC token for a short-lived Google token

env:
  TF_IN_AUTOMATION: 'true'
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_vm_service_account: ${{ vars.GCP_VM_SERVICE_ACCOUNT }}

jobs:
  terraform:
    if: vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ github.event_name == 'pull_request' && 'plan' || 'production' }}
    defaults:
      run:
        working-directory: infra/terraform/main
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform plan -input=false -out=tfplan
      - name: Apply
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false tfplan
      - name: Outputs
        if: github.event_name != 'pull_request'
        run: terraform output
