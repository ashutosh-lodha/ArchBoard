# Security headers for every ArchBoard response. Included in each location block because nginx
# drops server-level add_header directives in any location that sets its own.
# CSP: no inline scripts. Clerk (sign-in) loads its script from its Frontend API domain
# (clerk.archboard.ashutoshdev.online in production), shows avatars from img.clerk.com and may
# show a Cloudflare bot check in an iframe.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://clerk.archboard.ashutoshdev.online https://*.clerk.accounts.dev https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://img.clerk.com; font-src 'self'; connect-src 'self' https://clerk.archboard.ashutoshdev.online https://*.clerk.accounts.dev; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
