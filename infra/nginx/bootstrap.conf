# First boot only, before a certificate exists: answer ACME challenges and serve a holding page
# over HTTP. Replaced by archboard.conf as soon as certbot has issued the certificate.
server {
    listen 80;
    listen [::]:80;
    server_name archboard.ashutoshdev.online www.archboard.ashutoshdev.online;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { root /srv/archboard/current; try_files $uri /index.html; }
}
