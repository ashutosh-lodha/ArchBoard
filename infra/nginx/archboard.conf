# ArchBoard production edge (nginx on the VM host). Serves the built SPA from
# /srv/archboard/current (swapped atomically on deploy) and proxies /api to the API container on
# 127.0.0.1:3000. TLS certificates come from Let's Encrypt via certbot (webroot), renewed by
# certbot's systemd timer. Installed by /usr/local/bin/archboard-apply-nginx after `nginx -t`.

upstream archboard_api {
    server 127.0.0.1:3000;
    keepalive 8;
}

# HTTP: ACME challenges, everything else → HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name archboard.ashutoshdev.online www.archboard.ashutoshdev.online;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://archboard.ashutoshdev.online$request_uri; }
}

# www → apex.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.archboard.ashutoshdev.online;
    ssl_certificate     /etc/letsencrypt/live/archboard.ashutoshdev.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/archboard.ashutoshdev.online/privkey.pem;
    return 301 https://archboard.ashutoshdev.online$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name archboard.ashutoshdev.online;

    ssl_certificate     /etc/letsencrypt/live/archboard.ashutoshdev.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/archboard.ashutoshdev.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:archboard_ssl:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    root /srv/archboard/current;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # API: Express in Docker, reachable only from this host. Board content is at most 2 MB.
    location /api/ {
        include /etc/nginx/snippets/archboard-security-headers.conf;
        client_max_body_size 3m;
        proxy_pass http://archboard_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 30s;
    }

    # Hashed build assets and icons never change: cache for a year.
    location ~ ^/(assets|icons|landing)/ {
        include /etc/nginx/snippets/archboard-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html must always revalidate so a deploy is picked up immediately.
    location = /index.html {
        include /etc/nginx/snippets/archboard-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Single-page app: unknown paths fall back to index.html (client-side routing).
    location / {
        include /etc/nginx/snippets/archboard-security-headers.conf;
        try_files $uri /index.html;
    }
}
