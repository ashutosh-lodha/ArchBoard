# Local development stack: `docker compose -f infra/compose/compose.dev.yml up`
# Postgres and Redis are published on localhost only. With `--profile apps`, api and sync also
# run with hot reload: their dependencies live inside the dev image (Dockerfile.dev) and only the
# src/ folders are bind-mounted, so containers never modify the host node_modules.
# The web app runs on the host with `pnpm dev` for the fastest HMR.
name: archboard-dev

x-node-service: &node-service
  build:
    context: ../..
    dockerfile: infra/compose/Dockerfile.dev
  image: archboard-dev-node
  working_dir: /repo
  volumes:
    - ../../apps/api/src:/repo/apps/api/src:ro
    - ../../apps/sync/src:/repo/apps/sync/src:ro
    - ../../packages/shared/src:/repo/packages/shared/src:ro
    - ../../packages/diagram-schema/src:/repo/packages/diagram-schema/src:ro
    - ../../packages/protocol/src:/repo/packages/protocol/src:ro
    - ../../packages/db/src:/repo/packages/db/src:ro
  environment: &node-env
    NODE_ENV: development
    LOG_LEVEL: debug
    PUBLIC_ORIGIN: http://localhost:5180
    DATABASE_URL: postgresql://archboard:archboard@postgres:5432/archboard
    REDIS_URL: redis://redis:6379
    # Docker Desktop on Windows/macOS does not forward file events into containers: poll instead.
    CHOKIDAR_USEPOLLING: 'true'
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  profiles: [apps]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: archboard
      POSTGRES_PASSWORD: archboard
      POSTGRES_DB: archboard
    ports: ['127.0.0.1:5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U archboard -d archboard']
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 384m

  redis:
    image: redis:7-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '64mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports: ['127.0.0.1:6379:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 96m

  api:
    <<: *node-service
    command: ['pnpm', '--filter', '@archboard/api', 'dev']
    environment:
      <<: *node-env
      API_PORT: '3000'
    ports: ['127.0.0.1:3000:3000']

  sync:
    <<: *node-service
    command: ['pnpm', '--filter', '@archboard/sync', 'dev']
    environment:
      <<: *node-env
      SYNC_PORT: '4000'
    ports: ['127.0.0.1:4000:4000']

volumes:
  pgdata:
  redisdata:
