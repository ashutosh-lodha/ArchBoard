# Local development stack: `pnpm dev:services` starts Postgres (published on localhost only).
# With `--profile apps`, the API also runs here with hot reload: its dependencies live inside the
# dev image (Dockerfile.dev) and only src/ folders are bind-mounted, so the container never
# modifies the host's node_modules. The web app runs on the host with `pnpm dev`.
name: archboard-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: archboard
      POSTGRES_PASSWORD: archboard
      POSTGRES_DB: archboard
    ports: ['127.0.0.1:5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U archboard -d archboard']
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 384m

  api:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.dev
    image: archboard-dev-api
    working_dir: /repo
    command: ['pnpm', '--filter', '@archboard/api', 'dev']
    volumes:
      - ../../apps/api/src:/repo/apps/api/src:ro
      - ../../packages/shared/src:/repo/packages/shared/src:ro
      - ../../packages/diagram-schema/src:/repo/packages/diagram-schema/src:ro
      - ../../packages/db/src:/repo/packages/db/src:ro
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      PUBLIC_ORIGIN: http://localhost:5180
      API_PORT: '3000'
      DATABASE_URL: postgresql://archboard:archboard@postgres:5432/archboard
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      # Docker Desktop on Windows/macOS doesn't forward file events into containers: poll instead.
      CHOKIDAR_USEPOLLING: 'true'
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      postgres: { condition: service_healthy }
    profiles: [apps]

volumes:
  pgdata:
